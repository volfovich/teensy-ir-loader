; Teensy 4.0 + Audio Shield (Rev D) guitar IR loader
; Build & upload:  pio run -t upload      Serial monitor:  pio device monitor

[platformio]
; `pio run` builds the firmware only; the other envs are run by name (-e).
default_envs = teensy40

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200

build_flags =
    ; Audio block size = convolution partition size = latency knob.
    ; 32 -> ~1.5 ms buffering. Try 16 for ~0.7 ms (more CPU), 64/128 to save CPU.
    -D AUDIO_BLOCK_SAMPLES=32
    ; 48 kHz, the rate NAM amp models are trained at (NAM.md). The kits in
    ; kits/ must match it (tools/make_kits.py checks).
    -D AUDIO_SAMPLE_RATE_EXACT=48000.0f
    -Wall

; PlatformIO compiles every source file of a library it uses. The Teensy Audio
; library pulls in SD/SerialFlash; the deep LDF mode resolves them reliably.
lib_ldf_mode = deep+
; The core's linker script plus rules that keep cold library and UI code in
; flash, out of RAM1 (see the file).
board_build.ldscript = tools/imxrt1062_cold.ld
; Compiles the drum kits (kits/*/) and songs (songs/*.txt) into lib/irdsp/src.
extra_scripts = pre:tools/pio_kits.py
monitor_echo = yes
; NAM.md milestone M0: the A2-Lite engine's CPU cost, alone.
;   pio run -e nambench -t upload, then read the serial port.
[env:nambench]
platform = teensy
board = teensy40
framework = arduino
build_flags = -Wall
build_src_filter = -<*> +<../test/teensy/nam_bench.cpp>

; M0 follow-up: loop shapes for the dilated convolution, timed alone.
[env:nammicro]
platform = teensy
board = teensy40
framework = arduino
build_flags = -Wall
build_src_filter = -<*> +<../test/teensy/nam_micro.cpp>
